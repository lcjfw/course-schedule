<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人課表維護系統 - Course Schedule Management System</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Microsoft JhengHei', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', 'Microsoft JhengHei', sans-serif;
            background-color: #f8fafc;
        }
        /* Custom scrollbar for smooth web browsing */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* Styles optimized for clean printing */
        @media print {
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            body {
                background: white !important;
            }
            .shadow-card {
                box-shadow: none !important;
                border: 1px solid #cbd5e1 !important;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800 antialiased">

    <!-- Top Navigation Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-20 no-print shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Branding & Title -->
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-md shadow-sky-200">
                        <i class="fa-solid fa-calendar-days"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-slate-800 leading-tight">個人課表維護系統</h1>
                        <p class="text-xs text-slate-500">Course Schedule System</p>
                    </div>
                </div>

                <!-- Header Actions -->
                <div class="flex items-center space-x-2 sm:space-x-3">
                    <button onclick="openModal()" class="bg-sky-600 hover:bg-sky-700 text-white px-3 sm:px-4 py-2 rounded-lg font-medium text-sm transition flex items-center shadow-sm shadow-sky-200">
                        <i class="fa-solid fa-plus mr-1.5"></i>
                        <span>新增課程</span>
                    </button>
                    <button onclick="loadSampleSchedule()" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-2 rounded-lg font-medium text-sm transition flex items-center shadow-sm shadow-amber-100">
                        <i class="fa-solid fa-wand-magic-sparkles mr-1.5"></i>
                        <span class="hidden md:inline">載入預設範例</span>
                    </button>
                    <button onclick="window.print()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg font-medium text-sm transition flex items-center">
                        <i class="fa-solid fa-print mr-1.5"></i>
                        <span class="hidden sm:inline">列印 / 匯出</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Schedule Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- Toolbar & Statistics Bar -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 mb-6 flex flex-col md:flex-row items-center justify-between gap-4 no-print">
            <!-- Course Stats Info -->
            <div class="flex items-center space-x-4 w-full md:w-auto">
                <div class="flex items-center space-x-2 text-sm text-slate-600 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-100">
                    <i class="fa-solid fa-book text-sky-500"></i>
                    <span class="font-semibold text-slate-700" id="totalCoursesCount">總課程數: 0</span>
                    <span class="text-slate-300">|</span>
                    <i class="fa-solid fa-clock text-indigo-500"></i>
                    <span class="text-slate-600" id="totalHoursCount">每週總節數: 0 節</span>
                </div>
            </div>

            <!-- Management Tools (Weekend Switch, Backup Import/Export) -->
            <div class="flex items-center space-x-2 sm:space-x-3 w-full md:w-auto justify-end flex-wrap gap-y-2">
                <!-- Weekend Switch Toggle -->
                <label class="inline-flex items-center cursor-pointer mr-2 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200">
                    <input type="checkbox" id="toggleWeekend" onchange="toggleWeekendView()" class="sr-only peer">
                    <div class="relative w-9 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-sky-600"></div>
                    <span class="ms-2 text-xs font-medium text-slate-600">顯示週末</span>
                </label>

                <!-- Export JSON Button -->
                <button onclick="exportJSON()" class="text-slate-600 hover:text-sky-600 bg-slate-100 hover:bg-sky-50 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center border border-slate-200">
                    <i class="fa-solid fa-file-export mr-1"></i> 匯出 JSON
                </button>

                <!-- Import JSON Button -->
                <label class="text-slate-600 hover:text-sky-600 bg-slate-100 hover:bg-sky-50 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center border border-slate-200 cursor-pointer">
                    <i class="fa-solid fa-file-import mr-1"></i> 匯入 JSON
                    <input type="file" id="importFileInput" accept=".json" onchange="importJSON(event)" class="hidden">
                </label>

                <!-- Clear Schedule Button -->
                <button onclick="confirmClearAll()" class="text-rose-600 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center border border-rose-200">
                    <i class="fa-solid fa-trash-can mr-1"></i> 清空課表
                </button>
            </div>
        </div>

        <!-- Schedule Timetable Grid Table -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden shadow-card">
            <div class="overflow-x-auto">
                <table class="w-full border-collapse min-w-[700px] text-left">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs font-semibold">
                            <th class="py-3.5 px-3 w-24 text-center border-r border-slate-200">節次 / 時間</th>
                            <th class="py-3.5 px-2 text-center border-r border-slate-200 min-w-[120px]">星期一</th>
                            <th class="py-3.5 px-2 text-center border-r border-slate-200 min-w-[120px]">星期二</th>
                            <th class="py-3.5 px-2 text-center border-r border-slate-200 min-w-[120px]">星期三</th>
                            <th class="py-3.5 px-2 text-center border-r border-slate-200 min-w-[120px]">星期四</th>
                            <th class="py-3.5 px-2 text-center border-r border-slate-200 min-w-[120px]">星期五</th>
                            <th class="py-3.5 px-2 text-center border-r border-slate-200 min-w-[120px] weekend-col hidden">星期六</th>
                            <th class="py-3.5 px-2 text-center min-w-[120px] weekend-col hidden">星期日</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleTbody" class="divide-y divide-slate-200 text-sm">
                        <!-- Rendered dynamically by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Dialog for Adding / Editing Course -->
    <div id="courseModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden no-print opacity-0 transition-opacity duration-200">
        <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl overflow-hidden transform scale-95 transition-transform duration-200" id="modalBox">
            <!-- Modal Header -->
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                <h3 class="text-base font-bold text-slate-800 flex items-center" id="modalTitle">
                    <i class="fa-solid fa-book-bookmark text-sky-600 mr-2"></i> 新增課程
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full flex items-center justify-center hover:bg-slate-200 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Form Body -->
            <form id="courseForm" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
                <input type="hidden" id="courseId">

                <!-- Course Name Field -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">課程名稱 <span class="text-rose-500">*</span></label>
                    <input type="text" id="courseName" required placeholder="例如：網頁前端開發" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-sm">
                </div>

                <!-- Instructor & Location Fields -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">授課教師</label>
                        <input type="text" id="courseTeacher" placeholder="例如：林教授" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">上課教室</label>
                        <input type="text" id="courseLocation" placeholder="例如：資電 201" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-sm">
                    </div>
                </div>

                <!-- Day of the Week Selection -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">星期 <span class="text-rose-500">*</span></label>
                    <select id="courseDay" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-sm bg-white">
                        <option value="1">星期一</option>
                        <option value="2">星期二</option>
                        <option value="3">星期三</option>
                        <option value="4">星期四</option>
                        <option value="5">星期五</option>
                        <option value="6">星期六</option>
                        <option value="7">星期日</option>
                    </select>
                </div>

                <!-- Start & End Session Selection -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">開始節次 <span class="text-rose-500">*</span></label>
                        <select id="courseStartSlot" onchange="updateEndSlotOptions()" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-sm bg-white">
                            <!-- Populated by JS -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">結束節次 <span class="text-rose-500">*</span></label>
                        <select id="courseEndSlot" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-sm bg-white">
                            <!-- Populated by JS -->
                        </select>
                    </div>
                </div>

                <!-- Color Theme Selector -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">卡片主題顏色</label>
                    <div class="flex items-center space-x-3" id="colorPalette">
                        <!-- Dynamic Radios by JS -->
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="pt-4 border-t border-slate-200 flex justify-between items-center">
                    <button type="button" id="deleteBtn" onclick="deleteCurrentCourse()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-3 py-2 rounded-lg text-sm font-medium transition flex items-center hidden">
                        <i class="fa-solid fa-trash-can mr-1"></i> 刪除課程
                    </button>
                    <div class="flex space-x-2 ml-auto">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-100 transition">取消</button>
                        <button type="submit" class="px-4 py-2 bg-sky-600 hover:bg-sky-700 text-white rounded-lg text-sm font-medium transition shadow-sm">儲存課程</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Conflict Warning Modal Alert -->
    <div id="conflictModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden no-print">
        <div class="bg-white rounded-2xl max-w-sm w-full shadow-2xl p-6 text-center space-y-4">
            <div class="w-12 h-12 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h4 class="text-base font-bold text-slate-800">發現排課時間重疊 (衝堂提醒)</h4>
            <p class="text-sm text-slate-600" id="conflictMessage">該時間段已存在其他課程，請重新選擇。</p>
            <button onclick="closeConflictModal()" class="w-full py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-sm font-medium transition">重新修改時間</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 text-white px-4 py-3 rounded-xl shadow-lg flex items-center space-x-3 transform translate-y-20 opacity-0 transition-all duration-300 z-50 no-print">
        <i class="fa-solid fa-circle-check text-emerald-400 text-lg" id="toastIcon"></i>
        <span class="text-sm font-medium" id="toastMessage">操作成功</span>
    </div>

    <!-- Main Logic Script -->
    <script>
        // Standard Session Slots Configuration
        const SLOTS = [
            { id: 1, name: '第 1 節', time: '08:10 - 09:00' },
            { id: 2, name: '第 2 節', time: '09:10 - 10:00' },
            { id: 3, name: '第 3 節', time: '10:10 - 11:00' },
            { id: 4, name: '第 4 節', time: '11:10 - 12:00' },
            { id: 5, name: '第 5 節', time: '13:20 - 14:10' },
            { id: 6, name: '第 6 節', time: '14:20 - 15:10' },
            { id: 7, name: '第 7 節', time: '15:20 - 16:10' },
            { id: 8, name: '第 8 節', time: '16:20 - 17:10' },
            { id: 9, name: '第 9 節', time: '18:30 - 19:20' },
            { id: 10, name: '第 10 節', time: '19:25 - 20:15' }
        ];

        // Color Badge Themes
        const COLOR_THEMES = [
            { id: 'sky', name: '天空藍', bg: 'bg-sky-100', border: 'border-sky-300', text: 'text-sky-800', dot: 'bg-sky-500' },
            { id: 'emerald', name: '翡翠綠', bg: 'bg-emerald-100', border: 'border-emerald-300', text: 'text-emerald-800', dot: 'bg-emerald-500' },
            { id: 'rose', name: '珊瑚粉', bg: 'bg-rose-100', border: 'border-rose-300', text: 'text-rose-800', dot: 'bg-rose-500' },
            { id: 'amber', name: '溫暖橘', bg: 'bg-amber-100', border: 'border-amber-300', text: 'text-amber-800', dot: 'bg-amber-500' },
            { id: 'indigo', name: '羅蘭紫', bg: 'bg-indigo-100', border: 'border-indigo-300', text: 'text-indigo-800', dot: 'bg-indigo-500' }
        ];

        // Default Rich Sample Schedule
        const SAMPLE_COURSES = [
            { id: 's1', name: '網頁前端程式設計', teacher: '林教授', location: '資電 201', day: 1, startSlot: 2, endSlot: 4, color: 'sky' },
            { id: 's2', name: '資料結構與演算法', teacher: '陳教授', location: '理學 105', day: 2, startSlot: 5, endSlot: 7, color: 'emerald' },
            { id: 's3', name: '作業系統概論', teacher: '張教授', location: '資電 304', day: 3, startSlot: 2, endSlot: 4, color: 'indigo' },
            { id: 's4', name: '物件導向軟體工程', teacher: '黃教授', location: '資電 102', day: 4, startSlot: 6, endSlot: 8, color: 'rose' },
            { id: 's5', name: '期中專題實作與 Demo', teacher: '團隊合作', location: '創客中心', day: 5, startSlot: 5, endSlot: 6, color: 'amber' }
        ];

        // State Variables
        let courses = [];
        let showWeekend = false;
        let selectedColor = 'sky';

        // Window Onload Initialization
        window.onload = function() {
            loadFromLocalStorage();
            initSlotDropdowns();
            initColorPalette();
            renderGrid();
        };

        // LocalStorage Logic
        function loadFromLocalStorage() {
            const stored = localStorage.getItem('user_course_schedule_data');
            if (stored) {
                try {
                    courses = JSON.parse(stored);
                } catch (e) {
                    courses = [];
                }
            } else {
                courses = [...SAMPLE_COURSES];
                saveToLocalStorage();
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('user_course_schedule_data', JSON.stringify(courses));
            updateStatistics();
        }

        // Initialize Select Dropdowns
        function initSlotDropdowns() {
            const startSelect = document.getElementById('courseStartSlot');
            startSelect.innerHTML = SLOTS.map(s => `<option value="${s.id}">${s.name} (${s.time})</option>`).join('');
            updateEndSlotOptions();
        }

        function updateEndSlotOptions() {
            const startSlot = parseInt(document.getElementById('courseStartSlot').value || 1);
            const endSelect = document.getElementById('courseEndSlot');
            const prevEnd = parseInt(endSelect.value || startSlot);

            endSelect.innerHTML = SLOTS
                .filter(s => s.id >= startSlot)
                .map(s => `<option value="${s.id}">${s.name} (${s.time})</option>`)
                .join('');

            if (prevEnd >= startSlot) {
                endSelect.value = prevEnd;
            } else {
                endSelect.value = startSlot;
            }
        }

        // Color Palette Selector Setup
        function initColorPalette() {
            const container = document.getElementById('colorPalette');
            container.innerHTML = COLOR_THEMES.map(theme => `
                <label class="cursor-pointer flex items-center">
                    <input type="radio" name="colorTheme" value="${theme.id}" class="sr-only peer" ${theme.id === selectedColor ? 'checked' : ''} onchange="selectedColor='${theme.id}'">
                    <span class="w-7 h-7 rounded-full ${theme.dot} flex items-center justify-center ring-2 ring-transparent peer-checked:ring-offset-2 peer-checked:ring-slate-600 transition">
                        <i class="fa-solid fa-check text-white text-xs opacity-0 peer-checked:opacity-100"></i>
                    </span>
                </label>
            `).join('');
        }

        // Render Timetable Grid
        function renderGrid() {
            const tbody = document.getElementById('scheduleTbody');
            const maxDays = showWeekend ? 7 : 5;

            // Construct 2D Matrix map
            const matrix = {};
            SLOTS.forEach(s => {
                matrix[s.id] = {};
                for (let d = 1; d <= maxDays; d++) matrix[s.id][d] = null;
            });

            // Populate courses into matrix
            courses.forEach(course => {
                if (course.day <= maxDays) {
                    for (let s = course.startSlot; s <= course.endSlot; s++) {
                        if (matrix[s]) {
                            matrix[s][course.day] = {
                                ...course,
                                isStart: s === course.startSlot,
                                rowSpan: course.endSlot - course.startSlot + 1
                            };
                        }
                    }
                }
            });

            let html = '';
            SLOTS.forEach(slot => {
                html += `<tr class="hover:bg-slate-50/50 transition">`;
                
                // Session Header Cell
                html += `
                    <td class="py-3 px-2 text-center border-r border-slate-200 bg-slate-50/70">
                        <div class="font-bold text-slate-700 text-xs">${slot.name}</div>
                        <div class="text-[10px] text-slate-400 font-mono mt-0.5">${slot.time.split('-')[0]}</div>
                    </td>
                `;

                // Columns Monday through Sunday
                for (let day = 1; day <= maxDays; day++) {
                    const cellData = matrix[slot.id][day];

                    if (cellData) {
                        if (cellData.isStart) {
                            const theme = COLOR_THEMES.find(t => t.id === cellData.color) || COLOR_THEMES[0];
                            html += `
                                <td rowspan="${cellData.rowSpan}" class="p-1 border-r border-b border-slate-200 align-top">
                                    <div onclick="openModal('${cellData.id}')" 
                                         class="${theme.bg} ${theme.border} ${theme.text} border rounded-xl p-2.5 h-full cursor-pointer hover:shadow-md transition duration-150 flex flex-col justify-between group relative overflow-hidden">
                                        <div>
                                            <div class="font-bold text-xs sm:text-sm leading-snug group-hover:underline mb-1">${escapeHtml(cellData.name)}</div>
                                            ${cellData.location ? `<div class="text-[11px] opacity-90 flex items-center"><i class="fa-solid fa-location-dot mr-1 text-[10px]"></i>${escapeHtml(cellData.location)}</div>` : ''}
                                            ${cellData.teacher ? `<div class="text-[11px] opacity-80 flex items-center mt-0.5"><i class="fa-solid fa-user-graduate mr-1 text-[10px]"></i>${escapeHtml(cellData.teacher)}</div>` : ''}
                                        </div>
                                        <div class="text-[10px] opacity-70 mt-2 font-mono text-right">${cellData.startSlot}-${cellData.endSlot} 節</div>
                                    </div>
                                </td>
                            `;
                        }
                    } else {
                        // Empty cell slot
                        html += `
                            <td class="p-1 border-r border-b border-slate-200 text-center hover:bg-sky-50/50 cursor-pointer transition" 
                                onclick="openModalForSlot(${day}, ${slot.id})">
                                <div class="w-full h-10 flex items-center justify-center opacity-0 hover:opacity-100 text-sky-500">
                                    <i class="fa-solid fa-plus text-xs"></i>
                                </div>
                            </td>
                        `;
                    }
                }

                html += `</tr>`;
            });

            tbody.innerHTML = html;
            updateStatistics();
        }

        // Toggle Weekend Days Display
        function toggleWeekendView() {
            showWeekend = document.getElementById('toggleWeekend').checked;
            document.querySelectorAll('.weekend-col').forEach(el => {
                if (showWeekend) {
                    el.classList.remove('hidden');
                } else {
                    el.classList.add('hidden');
                }
            });
            renderGrid();
        }

        // Open Modal (New or Edit)
        function openModal(courseId = null) {
            const modal = document.getElementById('courseModal');
            const modalBox = document.getElementById('modalBox');
            const deleteBtn = document.getElementById('deleteBtn');
            const form = document.getElementById('courseForm');

            form.reset();

            if (courseId) {
                const course = courses.find(c => c.id === courseId);
                if (!course) return;

                document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-pen-to-square text-sky-600 mr-2"></i> 編輯課程';
                document.getElementById('courseId').value = course.id;
                document.getElementById('courseName').value = course.name;
                document.getElementById('courseTeacher').value = course.teacher || '';
                document.getElementById('courseLocation').value = course.location || '';
                document.getElementById('courseDay').value = course.day;
                document.getElementById('courseStartSlot').value = course.startSlot;
                updateEndSlotOptions();
                document.getElementById('courseEndSlot').value = course.endSlot;
                selectedColor = course.color || 'sky';
                deleteBtn.classList.remove('hidden');
            } else {
                document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-book-bookmark text-sky-600 mr-2"></i> 新增課程';
                document.getElementById('courseId').value = '';
                selectedColor = 'sky';
                deleteBtn.classList.add('hidden');
                updateEndSlotOptions();
            }

            initColorPalette();

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalBox.classList.remove('scale-95');
            }, 10);
        }

        // Quick Add Modal Triggered from Empty Cell
        function openModalForSlot(day, slot) {
            openModal();
            document.getElementById('courseDay').value = day;
            document.getElementById('courseStartSlot').value = slot;
            updateEndSlotOptions();
            document.getElementById('courseEndSlot').value = slot;
        }

        // Close Modal
        function closeModal() {
            const modal = document.getElementById('courseModal');
            const modalBox = document.getElementById('modalBox');

            modal.classList.add('opacity-0');
            modalBox.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        // Handle Add/Edit Course Submission with Conflict Detection
        function handleFormSubmit(e) {
            e.preventDefault();

            const id = document.getElementById('courseId').value || 'c_' + Date.now();
            const name = document.getElementById('courseName').value.trim();
            const teacher = document.getElementById('courseTeacher').value.trim();
            const location = document.getElementById('courseLocation').value.trim();
            const day = parseInt(document.getElementById('courseDay').value);
            const startSlot = parseInt(document.getElementById('courseStartSlot').value);
            const endSlot = parseInt(document.getElementById('courseEndSlot').value);

            if (startSlot > endSlot) {
                showToast('結束節次必須大於或等於開始節次', 'error');
                return;
            }

            // Conflict Check Logic
            const conflictCourse = courses.find(c => {
                if (c.id === id) return false; // Ignore current editing target
                if (c.day !== day) return false;
                return (startSlot <= c.endSlot && endSlot >= c.startSlot);
            });

            if (conflictCourse) {
                showConflictModal(`星期${getDayName(day)} 第 ${startSlot}-${endSlot} 節 與已存在的「${conflictCourse.name}」發生衝堂！`);
                return;
            }

            const courseData = {
                id,
                name,
                teacher,
                location,
                day,
                startSlot,
                endSlot,
                color: selectedColor
            };

            const index = courses.findIndex(c => c.id === id);
            if (index >= 0) {
                courses[index] = courseData;
                showToast('課程已成功更新');
            } else {
                courses.push(courseData);
                showToast('已新增課程');
            }

            saveToLocalStorage();
            renderGrid();
            closeModal();
        }

        // Conflict Warning Alert Trigger
        function showConflictModal(msg) {
            document.getElementById('conflictMessage').innerText = msg;
            document.getElementById('conflictModal').classList.remove('hidden');
        }

        function closeConflictModal() {
            document.getElementById('conflictModal').classList.add('hidden');
        }

        // Delete Course
        function deleteCurrentCourse() {
            const id = document.getElementById('courseId').value;
            if (!id) return;

            if (confirm('確定要刪除這門課程嗎？')) {
                courses = courses.filter(c => c.id !== id);
                saveToLocalStorage();
                renderGrid();
                closeModal();
                showToast('課程已成功刪除');
            }
        }

        // Load Sample Schedule
        function loadSampleSchedule() {
            if (courses.length > 0) {
                if (!confirm('載入預設範例會覆蓋您目前的課表，是否繼續？')) return;
            }
            courses = [...SAMPLE_COURSES];
            saveToLocalStorage();
            renderGrid();
            showToast('已成功載入預設課表！');
        }

        // Clear All Schedule Data
        function confirmClearAll() {
            if (courses.length === 0) {
                showToast('目前課表已是空的', 'info');
                return;
            }
            if (confirm('確定要清空所有課程資料嗎？此動作無法復原。')) {
                courses = [];
                saveToLocalStorage();
                renderGrid();
                showToast('已清空所有課程');
            }
        }

        // Export JSON Backup File
        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(courses, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `Course_Schedule_Backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
            showToast('已成功匯出 JSON 備份檔！');
        }

        // Import JSON Backup File
        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        courses = imported;
                        saveToLocalStorage();
                        renderGrid();
                        showToast('成功匯入 JSON 課表！');
                    } else {
                        showToast('匯入失敗：JSON 格式不符', 'error');
                    }
                } catch (err) {
                    showToast('匯入失敗，請確認檔案格式', 'error');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // Update Header Statistics
        function updateStatistics() {
            const totalCourses = courses.length;
            let totalHours = 0;
            courses.forEach(c => {
                totalHours += (c.endSlot - c.startSlot + 1);
            });

            document.getElementById('totalCoursesCount').innerText = `總課程數: ${totalCourses}`;
            document.getElementById('totalHoursCount').innerText = `每週總節數: ${totalHours} 節`;
        }

        // Toast Helper Function
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMessage.innerText = msg;

            if (type === 'error') {
                toastIcon.className = 'fa-solid fa-circle-xmark text-rose-400 text-lg';
            } else if (type === 'info') {
                toastIcon.className = 'fa-solid fa-circle-info text-sky-400 text-lg';
            } else {
                toastIcon.className = 'fa-solid fa-circle-check text-emerald-400 text-lg';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');

            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Helper Functions
        function getDayName(day) {
            const names = ['', '一', '二', '三', '四', '五', '六', '日'];
            return names[day] || '';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
